name: daily digest

on:
  schedule:
    - cron: "0 10 * * *" # 19:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Claude API は API キーではなく OIDC（Workload Identity Federation）で認証する。
      # GitHub の ID トークンをファイルに書き、SDK に ANTHROPIC_IDENTITY_TOKEN_FILE で渡す。
      # ANTHROPIC_API_KEY は空でも設定されていると OIDC より優先されるので、ここでは一切渡さない。
      - name: Get OIDC token for Claude API
        uses: actions/github-script@v8
        env:
          AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
        with:
          script: |
            const fs = require("node:fs");
            const token = await core.getIDToken(process.env.AUDIENCE || undefined);
            const file = `${process.env.RUNNER_TEMP}/anthropic-oidc-token`;
            fs.writeFileSync(file, token, { mode: 0o600 });
            core.exportVariable("ANTHROPIC_IDENTITY_TOKEN_FILE", file);
      - run: npm run generate
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
